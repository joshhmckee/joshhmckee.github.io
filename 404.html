<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8PGS64HF0B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    gtag('config', 'G-8PGS64HF0B');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File Not Found · Josh McKee</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
  <style>
    :root { --phos: #46ff86; --dim: #23a653; --bg: #020a05; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      font: clamp(20px, 3.2vw, 30px)/1.3 'VT323', 'Courier New', monospace;
      color: var(--phos); text-shadow: 0 0 6px rgba(70, 255, 134, 0.55);
      font-variant-ligatures: none;
    }
    .crt {
      position: relative; width: min(760px, 100%); padding: 28px 30px 34px;
      background: radial-gradient(ellipse at center, #062012, var(--bg) 70%);
      border-radius: 18px / 14px; box-shadow: 0 0 0 12px #d4c9aa, 0 0 0 16px #8f8468, 0 0 60px rgba(70, 255, 134, 0.15);
      overflow: hidden;
    }
    .crt::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.3) 0 1px, transparent 1px 3px);
    }
    h1 { font: inherit; margin: 0 0 0.8em; }
    p { margin: 0 0 0.4em; }
    .dim { color: var(--dim); }
    .choices { display: flex; flex-wrap: wrap; gap: 0.3em 1.2em; margin-top: 1.2em; }
    a { color: var(--bg); background: var(--phos); padding: 0 0.35em; text-decoration: none; text-shadow: none; }
    a:hover, a:focus-visible { background: #b8ffcf; outline: none; }
    .cursor { animation: blink 1s steps(2, jump-none) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
</head>
<body>
  <main class="crt">
    <p class="dim">C:\&gt; CD <span id="path">\PAGE</span></p>
    <h1>File not found.</h1>
    <p>The page you asked for isn't in the filing cabinet.</p>
    <p class="choices">
      <a href="/" accesskey="a">[A]bort &rarr; back to the office</a>
      <a href="#" id="retry" accesskey="r">[R]etry</a>
      <a href="/" accesskey="f">[F]ail</a>
    </p>
    <p class="dim" style="margin-top:1.2em">C:\&gt; <span class="cursor">&#9608;</span></p>
  </main>
  <script>
    var p = location.pathname.replace(/\//g, '\\').toUpperCase();
    document.getElementById('path').textContent = p.length > 1 ? p : '\\PAGE';
    document.getElementById('retry').addEventListener('click', function (e) { e.preventDefault(); location.reload(); });
    document.addEventListener('keydown', function (e) {
      var k = e.key.toLowerCase();
      if (k === 'a') location.href = '/';
      else if (k === 'r') location.reload();
      else if (k === 'f') location.href = '/';
    });
  </script>
</body>
</html>
